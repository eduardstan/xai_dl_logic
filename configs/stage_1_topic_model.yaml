#
# Stage 1: Topic Modeling Configuration
#
# Parameters for embedding generation, dimensionality reduction (UMAP),
# clustering (HDBSCAN), and topic modeling with BERTopic.
#

# Settings for the sentence transformer model used for embeddings.
embedding_model:
  # Hugging Face model name. "all-MiniLM-L6-v2" is fast and effective.
  name: "all-MiniLM-L6-v2"
  # Batch size for embedding generation.
  batch_size: 64
  # Whether to show the progress bar during embedding.
  show_progress: true
  # Device to use ("cuda", "cpu", "auto").
  device: "auto"
  # Whether to cache generated embeddings to disk to speed up subsequent runs.
  cache_embeddings: true

# Parameters for UMAP dimensionality reduction.
umap_params:
  n_neighbors: 15
  n_components: 256
  min_dist: 0.0
  metric: "cosine"

# Parameters for HDBSCAN clustering.
hdbscan_params:
  min_cluster_size: 16
  max_cluster_size: 128
  min_samples: 5
  cluster_selection_epsilon: 0.1
  metric: "euclidean"
  cluster_selection_method: "eom"
  prediction_data: true

# Parameters for the CountVectorizer used by BERTopic.
vectorizer_params:
  stop_words: "english"
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95
  max_features: 5000

# Core parameters for the BERTopic model itself.
bertopic_params:
  min_topic_size: 10
  calculate_probabilities: false
  verbose: true

# General data processing settings for topic modeling.
data_processing:
  # The text fields from the bibliography to concatenate for analysis.
  text_fields:
    - "abstract"
    - "title"
    - "keywords"

# Configuration for the outlier reduction phase, which reassigns outlier
# documents to existing topics based on a series of strategies.
outlier_reduction:
  enabled: true
  # NOTE: Strategies are chained and executed in order.
  strategies:
    - strategy: "c-tf-idf"
      threshold: 0.1
    - strategy: "embeddings"
      threshold: 0.7
    - strategy: "distributions"
      threshold: 0.05
      distributions_params:
        min_similarity: 0.05
        window: 4
        stride: 1
  # If true, topic representations are recalculated after outlier reduction.
  # Set to false to preserve the original, more coherent topic names.
  update_representations: false
  save_intermediate_results: true

# Domain knowledge injection for guiding the topic modeling process.
domain_guidance:
  # Seed words can be used to improve the quality of topic representations.
  seed_words:
    enabled: false
    multiplier: 2.0
    words: [
      "explainable", "interpretable", "xai", "symbolic", "logic", "formal",
      "knowledge", "ontology", "decision tree", "rule", "reasoning",
      "neuro-symbolic", "transformer", "attention", "embedding", "gradient",
      "cnn", "convolutional", "rnn", "recurrent", "lstm", "gru", "gnn", "graph"
    ]
  # Guided Topic Modeling uses seed words to force specific topics to emerge.
  guided_topics:
    enabled: false
    topics:
      convolutional_networks:
        seeds: ["cnn", "convolution", "convolutional", "filter", "pooling"]
      transformer_attention:
        seeds: ["transformer", "attention", "bert", "self-attention", "encoder"]
      graph_neural_networks:
        seeds: ["gnn", "graph", "node", "edge", "adjacency"] 