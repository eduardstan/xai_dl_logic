[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research_analysis"
version = "0.1.0"
description = "A unified framework for systematic bibliography analysis using advanced topic modeling, paper selection, and visualization."
readme = "README.md"
authors = [
    { name = "Eduard", email = "stan.i.eduard@gmail.com" }
]
maintainers = [
    { name = "Eduard", email = "stan.i.eduard@gmail.com" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "topic-modeling",
    "bibliography-analysis", 
    "systematic-review",
    "bertopic",
    "research-analysis",
    "literature-review",
    "paper-selection",
    "academic-research"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
    "Typing :: Typed",
]

dependencies = [
    "bertopic>=0.16.0",
    "bibtexparser>=1.4.0",
    "hdbscan>=0.8.0",
    "loguru>=0.7.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.17.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "sentence-transformers>=2.2.0",
    "typer[all]>=0.9.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "cuml-cu11>=23.0.0",  # GPU-accelerated UMAP
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/your-username/research_analysis"
Documentation = "https://github.com/your-username/research_analysis#readme"
Repository = "https://github.com/your-username/research_analysis"
"Bug Tracker" = "https://github.com/your-username/research_analysis/issues"
Changelog = "https://github.com/your-username/research_analysis/blob/main/CHANGELOG.md"

[project.scripts]
research-analysis = "research_analysis.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_analysis = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | legacy
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "bertopic.*",
    "umap.*",
    "hdbscan.*",
    "plotly.*",
    "bibtexparser.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/research_analysis"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/legacy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]