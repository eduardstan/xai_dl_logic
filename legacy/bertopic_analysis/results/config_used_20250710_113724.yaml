    - deep
    - reinforcement
    - neural
    - network
embedding_model:
  batch_size: 64
  device: auto
  name: all-MiniLM-L6-v2
  show_progress: true
hdbscan_params:
  cluster_selection_epsilon: 0.1
  cluster_selection_method: eom
  max_cluster_size: 128
  metric: euclidean
  min_cluster_size: 16
  min_samples: 5
  prediction_data: true
outlier_reduction:
  enabled: true
  save_intermediate_results: true
  strategies:
  - strategy: c-tf-idf
    threshold: 0.1
  - strategy: embeddings
    threshold: 0.7
  - distributions_params:
      min_similarity: 0.05
      stride: 1
      window: 4
    strategy: distributions
    threshold: 0.05
  update_representations: false
output:
  cache_dir: cache
  cache_embeddings: true
  models_dir: models
  plots_dir: plots
  results_dir: results
  save_embeddings: true
  save_model: true
  save_topics: true
random_seed: 42
systematic_review:
  base_papers_per_cluster: 4
  cluster_thresholds:
    large: 80
    medium: 40
    small: 20
    xlarge: 150
    xxlarge: 300
  compute_metrics:
  - similarity_to_centroid
  - similarity_to_cluster_papers
  - diversity_score
  - representativeness_score
  diversity_weight: 0.75
  max_papers_per_cluster: 200
  min_diversity_threshold: 0.25
  min_papers_per_cluster: 2
  research_keywords:
    subsymbolic:
    - sub*symbolic
    - deep*learning
    - neural*
    - network*
    - layer*
    - tensor*
    - differentiab*
    - neuro*symbolic
    - deep reinforcement learning
    symbolic:
    - symbol*
    - logic*
    - formal*
    - knowledge*
    - ontolog*
    - decision tree*
    - decision list*
    - decision set*
    - constraint*
    - rule
    - rules
    - reasoning
    xai:
    - explainab*
    - interpretab*
    - accountab*
    - explicab*
    - transparen*
    - translucen*
    - XAI
    - IML
  selection_iterations: 20
  selection_strategy: diverse_representative
  selection_strategy_type: ratio_based
  similarity_threshold: 0.8
  target_selection_ratio: 0.15
  use_iterative_selection: true
timestamp_format: '%Y%m%d_%H%M%S'
umap_params:
  metric: cosine
  min_dist: 0.0
  n_components: 128
  n_neighbors: 15
visualization:
  hide_document_hover: false
  interactive_datamapplot: true
  plot_format: html
  reduce_embeddings_for_viz: true
  save_plots: true
